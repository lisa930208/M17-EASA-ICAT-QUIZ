const D=[{"id":"M17-E1-1","m":"M17","b":"E","c":1,"n":1,"q":"High speed propellers are designed to.","o":["rotate at high RPM.","operate at high forward speeds.","operate at supersonic tip speeds."],"a":1,"e":""},{"id":"M17-E1-2","m":"M17","b":"E","c":1,"n":2,"q":"When in the windmill position ATM.","o":["opposes CTM.","is not related to CTM.","assists CTM."],"a":2,"e":"ATM normally increases blade angle but in the windmill condition reverses and assists CTM."},{"id":"M17-E1-3","m":"M17","b":"E","c":1,"n":3,"q":"The optimum angle for a fixed pitch propeller is.","o":["15 degrees.","2 - 4 degrees.","6 - 10 degrees."],"a":1,"e":""},{"id":"M17-E1-4","m":"M17","b":"E","c":1,"n":4,"q":"A left handed propeller is one that.","o":["rotates clockwise when viewed from the rear.","rotates clockwise when viewed from the front.","is fitted to an engine on the left side of the aircraft."],"a":1,"e":"Left hand propeller rotates anti-clockwise when viewed from the rear."},{"id":"M17-E1-5","m":"M17","b":"E","c":1,"n":5,"q":"Forces acting on a propeller are.","o":["centrifugal, twisting, and bending.","torque, thrust and centrifugal.","torsion, tension and thrust."],"a":0,"e":""},{"id":"M17-E1-6","m":"M17","b":"E","c":1,"n":6,"q":"The blade angle at the root is.","o":["less than the tip.","same from tip to root.","greater than the tip."],"a":2,"e":""},{"id":"M17-E1-7","m":"M17","b":"E","c":1,"n":7,"q":"What force on a propeller blade turns the blades to a fine pitch?","o":["ATM.","Torque.","CTM."],"a":2,"e":""},{"id":"M17-E1-8","m":"M17","b":"E","c":1,"n":8,"q":"The purpose of propeller twist is.","o":["coarsen the blade angle at the root.","to maintain Blade Angle along the blade.","to maintain Angle of Attack at the same value along the blade."],"a":2,"e":""},{"id":"M17-E1-9","m":"M17","b":"E","c":1,"n":9,"q":"The forces acting on a propeller blade are.","o":["bending, twisting and centrifugal.","thrust, aerodynamic and tension.","thrust and torque."],"a":0,"e":""},{"id":"M17-E1-10 io of output speed to input propeller speed.","the ratio of the work applied to the geometric pitch to useful work on the C.S.U.","the ratio of the useful work done by the propeller to work done by the engine on the propeller."],"a":2,"e":""},{"id":"M17-E1-20","m":"M17","b":"E","c":1,"n":20,"q":"Geometric Pitch is the distance moved.","o":["in one revolution.","in one revolution when slip is maximum.","in one revolution without slip."],"a":2,"e":"CTM increases as a function of Centrifugal."},{"id":"M17-E1-21","m":"M17","b":"E","c":1,"n":21,"q":"As propeller rotation speed increases the centrifugal turning moment on the blades will.","o":["increase.","decrease.","remain constant through r.p.m. range."],"a":0,"e":""},{"id":"M17-E1-22","m":"M17","b":"E","c":1,"n":22,"q":"Propeller torque is the resistance offered by the propeller to.","o":["feathering.","changing pitch.","rotation."],"a":2,"e":""},{"id":"M17-E1-23","m":"M17","b":"E","c":1,"n":23,"q":"The angle between the resultant airflow direction and the propeller blade plane of rotation is known as.","o":["angle of attack.","blade angle.","helix angle or angle of advance."],"a":2,"e":"The helix angle is the angle between the plane of rotation and the relative airflow."},{"id":"M17-E1-24","m":"M17","b":"E","c":1,"n":24,"q":"At constant rpm, advance per revolution depends on.","o":["shaft horse power.","forward speed.","length of blade."],"a":1,"e":""},{"id":"M17-E1-25","m":"M17","b":"E","c":1,"n":25,"q":"Aerodynamic Twisting Moment.","o":["turns the blade to windmill.","turns the blades to high pitch.","turns the blade to feather."],"a":1,"e":""},{"id":"M17-E1-26","m":"M17","b":"E","c":1,"n":26,"q":"Under normal operation the point of maximum stress on a propeller blade is at the.","o":["blade root.","blade tip.","leading edge along blade length."],"a":0,"e":""},{"id":"M17-E1-27","m":"M17","b":"E","c":1,"n":27,"q":"Propeller blade angle.","o":["is constant along the blade length.","decreases from root to tip.","incr q":"The velocity of the slipstream behind the aircraft in relation to the ambient air is.","o":["less.","greater.","equal."],"a":1,"e":"If there was not a difference then no thrust would be produced. T = mass (Vout - Vin)."},{"id":"M17-E1-37","m":"M17","b":"E","c":1,"n":37,"q":"High speed aerofoils are employed at.","o":["the master station.","the tips.","the root."],"a":1,"e":"On helicopters they are called BERP tips."},{"id":"M17-E1-38","m":"M17","b":"E","c":1,"n":38,"q":"A right hand propeller.","o":["rotates clockwise when viewed from the rear.","is always fitted to the starboard engine.","rotates clockwise when viewed from the front."],"a":0,"e":"Left or right is determined by sitting in the cockpit and viewing the rotation."},{"id":"M17-E1-39","m":"M17","b":"E","c":1,"n":39,"q":"Given that blade angle is measured from the centre of the hub, the blade angle at the hub is considered to be.","o":["lowest.","Master Station value.","highest."],"a":2,"e":""},{"id":"M17-E1-40","m":"M17","b":"E","c":1,"n":40,"q":"A windmilling propeller will create.","o":["more drag in feather.","more drag in fine pitch.","more drag in coarse pitch."],"a":1,"e":"A windmilling propeller is always in fine pitch."},{"id":"M17-E1-41","m":"M17","b":"E","c":1,"n":41,"q":"The chord line of a propeller is.","o":["a line joining the leading and trailing edges.","a line joining the tip to the root of the blade.","a line joining the tips of the blades."],"a":0,"e":""},{"id":"M17-E1-42","m":"M17","b":"E","c":1,"n":42,"q":"The plane of rotation is defined as.","o":["the plane in which thrust force acts.","the plane in which the propeller rotates.","the angle at which the blade strikes the airflow."],"a":1,"e":""},{"id":"M17-E1-43","m":"M17","b":"E","c":1,"n":43,"q":"Thrust bending force on a propeller blade.","o":["intensifies the centrifugal forces to some degrees.","can be used in propeller design to reduce some operation stress.","tends to bend the propeller blade forward at the tip."],"a":2,"e":""},{"id":"M17-E1-44","m":"M17","b":"E","c":1,"n":44,"q":"What conditions are applied to a propeller blade windmilling?","o":["Positive angle of attack, thrust negative.","Negative angle of attack, thrust positive.","Negative angle of attack, thrust negative."],"a":2,"e":""},{"id":"M17-E1-45","m":"M17","b":"E","c":1,"n":45,"q":"The primary purpose of propeller is to.","o":["change engine horsepower to thrust.","provide static and dynamic stability to aircraft.","create lift on the fixed aerofoils of an aircraft."],"a":0,"e":""},{"id":"M17-E1-46","m":"M17","b":"E","c":1,"n":46,"q":"The primary purpose of a feathering propeller is to.","o":["prevent further engine damage when an engine fails in flight.","prevent propeller damage when an engine fails in flight.","eliminate the drag created by a windmilling propeller when an engine fails in flight."],"a":2,"e":""},{"id":"M17-E2-1","m":"M17","b":"E","c":2,"n":1,"q":"A fibreglass composite blade.","o":["will never be struck by lighting.","does not require lightning strike protection.","requires lightning strike protection."],"a":2,"e":""},{"id":"M17-E2-2","m":"M17","b":"E","c":2,"n":2,"q":"The timber most often used today for propeller construction is.","o":["birch.","spruce.","balsa."],"a":0,"e":""},{"id":"M17-E2-3","m":"M17","b":"E","c":2,"n":3,"q":"Electronic torque measuring systems utilise.","o":["strain gauges in the reduction gear.","stress gauges in the reduction gear.","pressure transducers in the reduction gear."],"a":0,"e":""},{"id":"M17-E2-4","m":"M17","b":"E","c":2,"n":4,"q":"A conventional turboprop torque meter uses.","o":["hydraulic oil as the pressure medium.","coiled spring levers as the pressure medium.","engine oil as the pressure medium."],"a":2,"e":""},{"id":"M17-E2-5","m":"M17","b":"E","c":2,"n":5,"q":"Metal at the tip and along the leading edge of a wooden propeller is.","o":["for balancing.","for protection.","for Anti-icing."],"a":1,"e":""},{"id":"M17-E2-6","m":"M17","b":"E","c":2,"n":6,"q":"Blade cuffs are fitted to the root of the blades.","o":["to increase the strength of the blade.","to increase thrust.","to increase flow of cooling air into the engine nacelle."],"a":2,"e":""},{"id":"M17-E2-7","m":"M17","b":"E","c":2,"n":7,"q":"Low torque sensing is used to.","o":["increase power.","increase pitch.","initiate auto-feather."],"a":2,"e":""},{"id":"M17-E2-8","m":"M17","b":"E","c":2,"n":8,"q":"Torque sensing is used to.","o":["reduce drag.","reduce drag following engine shutdown.","synchronise blade angle."],"a":1,"e":""},{"id":"M17-E2-9","m":"M17","b":"E","c":2,"n":9,"q":"The minimum percentage seating on a propeller rear cone should be.","o":["90%.","70%.","95%."],"a":1,"e":""},{"id":"M17-E2-10","m":"M17","b":"E","c":2,"n":10,"q":"The propeller is 'feathered' when the blades are at.","o":["0° to plane of rotation.","20° to plane of rotation.","90° to plane of rotation."],"a":2,"e":""},{"id":"M17-E2-11","m":"M17","b":"E","c":2,"n":11,"q":"The thrust of a propeller is normally taken by the.","o":["torque meter.","propeller rear cone.","front bearing in the reduction gear."],"a":2,"e":""},{"id":"M17-E2-12","m":"M17","b":"E","c":2,"n":12,"q":"On which type of turbo-propeller would you expect to find a parking brake?","o":["Compounded twin spool.","Direct coupled twin spool.","Free turbine."],"a":2,"e":"The parking brake stops the propeller rotating when the engine is stopped."},{"id":"M17-E2-13","m":"M17","b":"E","c":2,"n":13,"q":"What does the torquemeter reading indicate in a gas turbine engine?","o":["Torque reaction at the reduction gear.","The ratio between engine thrust and engine torque.","Engine torque."],"a":0,"e":""},{"id":"M17-E2-14","m":"M17","b":"E","c":2,"n":14,"q":"The gear segments on the blade roots of a hydromatic propeller mesh with the.","o":["stationary cam.","torque tubes and eye bolts.","moving cam."],"a":2,"e":""},{"id":"M17-E2-15","m":"M17","b":"E","c":2,"n":15,"q":"A propeller is centralised on the propeller shaft by.","o":["the front and rear cones.","the front git seal.","the rear pre-load shims."],"a":0,"e":""},{"id":"M17-E2-16","m":"M17","b":"E","c":2,"n":16,"q":"Reduction gearing allows the.","o":["blade tips to operate below the speed of sound.","blade tips to operate above the speed of sound.","blade tips to rotate slower than the root of the propeller blade."],"a":0,"e":"Propellers always operate slower than the engine to ensure the blade tips do not go sonic."},{"id":"M17-E2-17","m":"M17","b":"E","c":2,"n":17,"q":"When fitting a propeller to a tapered shaft.","o":["locate the master spline.","ensure the master spline and blade alignment are in accordance with the MM.","ensure fully seated."],"a":0,"e":""},{"id":"M17-E2-18","m":"M17","b":"E","c":2,"n":18,"q":"What is the purpose of small holes at the tip of wooden propellers?","o":["Drainage.","Balancing.","Pivot points used during manufacture."],"a":0,"e":""},{"id":"M17-E2-19","m":"M17","b":"E","c":2,"n":19,"q":"The thrust face of a propeller blade is the.","o":["root to which the gear segment is fitted.","blade face or flat side.","blade back or curved side."],"a":1,"e":""},{"id":"M17-E2-20","m":"M17","b":"E","c":2,"n":20,"q":"Solidity of a propeller can be increased by.","o":["increasing blade chord.","increasing blade angle.","increasing blade thickness."],"a":0,"e":""},{"id":"M17-E2-21","m":"M17","b":"E","c":2,"n":21,"q":"A turbo-prop engine.","o":["uses an epicyclic reduction gear system.","uses a spur gear reduction system.","does not require a reduction gear system due to the propshaft being driven from the low speed compressor."],"a":0,"e":"All large engines use Epicyclic reduction gearing."},{"id":"M17-E2-22","m":"M17","b":"E","c":2,"n":22,"q":"Total power of a turbo-prop engine is measured in.","o":["Equivalent Shaft Horsepower (ESHP).","Shaft Horsepower (SHP).","Brake Horsepower (BHP)."],"a":0,"e":"ESHP is SHP plus residual thrust."},{"id":"M17-E2-23","m":"M17","b":"E","c":2,"n":23,"q":"The disadvantage of using reverse pi ot seat properly the hub cannot be held firm."},{"id":"M17-E6-57","m":"M17","b":"E","c":6,"n":57,"q":"When measuring RPM on a supercharged engine with variable pitch.","o":["maximum boost pressure and actual air pressure is used.","engine boost pressure and actual air pressure is used.","zero boost pressure and actual air pressure is used."],"a":2,"e":"testing on the fine pitch stops and at the same manifold pressure indicated before the engine was started (IE zero boost), corrected for."},{"id":"M17-E6-58","m":"M17","b":"E","c":6,"n":58,"q":"On propeller securing plates circlips should be.","o":["annealed and the springiness put back into the circlip before it can be used again.","used once only.","used again as long as the circlip springs back first time."],"a":1,"e":"Lycoming have issued mandatory service bulletin 240S dated 3 Feb 2003 stating that circlips, lockplates shims and retaining rings must be replaced at overhaul or removal regardless of condition."},{"id":"M17-E6-59","m":"M17","b":"E","c":6,"n":59,"q":"The cause of propeller out-of-track vibration is.","o":["propeller blade angle too large.","static imbalance.","blade stiffness not exactly matched."],"a":2,"e":"Vibration caused by blades being out of track means that the blades do not rotate in the same plane of rotation. Variable blade stiffness could cause the blades to flex and thus cause the blades not to track in the same plane."},{"id":"M17-E6-60","m":"M17","b":"E","c":6,"n":60,"q":"How is blending carried out on an aluminium propeller blade?","o":["By using a course file and peening.","By using a needle file and finish with emery cloth.","By using a scraper."],"a":1,"e":""},{"id":"M17-E6-61","m":"M17","b":"E","c":6,"n":61,"q":"Where would you find information on RPM and Power ratings?","o":["Painted onto the propeller.","Engine Log book.","Etched on the Propeller."],"a":1,"e":"the reference RPM is recorded in the engine log book for power assurance checks."},{"id":"M17-E6-62","m":"M17","b":"E","  heads securing metal tipping."],"a":0,"e":"Solder or finish can be replaced elongated holes cannot."},{"id":"M17-E6-67","m":"M17","b":"E","c":6,"n":67,"q":"Inspection of a propeller blade by dye penetrant inspection is accomplished to detect.","o":["cracks.","corrosion at the blade tip.","torsional stress."],"a":0,"e":"Dye penetrant techniques are used to detect surface cracks."},{"id":"M17-E6-68","m":"M17","b":"E","c":6,"n":68,"q":"Which of the following is used to correct horizontal imbalance of a wooden propeller?","o":["Shellac.","Brass screws.","Solder."],"a":2,"e":"CAIPs state that adding solder to the metal tiping of the blade is the correct method for horizontal balance. Brass screws are added for vertical imbalance on the lightwieght side of the hub."},{"id":"M17-E6-69","m":"M17","b":"E","c":6,"n":69,"q":"Which of the following determines oil and grease specifications for lubrication of propellers?","o":["Propeller manufacturers.","Engine Manufacturers.","Airframe manufacturers."],"a":0,"e":""},{"id":"M17-E6-70","m":"M17","b":"E","c":6,"n":70,"q":"What type of imbalance will cause a two-bladed propeller to have a persistent tendency to come to rest in a horizontal position (with the blades parallel to the ground) while being checked on a propeller balance beam?","o":["Harmonic.","Vertical.","Horizontal."],"a":1,"e":""},{"id":"M17-E6-71","m":"M17","b":"E","c":6,"n":71,"q":"What is the purpose of an arbor used in balancing a propeller?","o":["To support the propeller on the balance knives.","To mark the propeller blades where weights are to be be attached.","To level the balance stand."],"a":0,"e":""},{"id":"M17-E6-72","m":"M17","b":"E","c":6,"n":72,"q":"The application of more protective coating on one blade than another when refinishing a wood propeller.","o":["has little or no effect on operating characteristics.","may be necessary to achieve final balancing.","should never be done."],"a":1,"e":""},{"id":"M17-E6-73","m":"M17","b":"E","c":6,"n":73,"q":"Apparent engine roughness is often a result of propeller unbalance. The effect of an unbalanced propeller will usually be.","o":["greater at high RPM.","greater at low RPM.","approximately the same at all speeds."],"a":0,"e":""},{"id":"M17-E6-74","m":"M17","b":"E","c":6,"n":74,"q":"Propeller aerodynamic (thrust) imbalance can be largely eliminated by.","o":["correct blade contouring and angle setting.","static balancing.","keeping the propeller blades within the same plane of rotation."],"a":0,"e":""},{"id":"M17-E6-75","m":"M17","b":"E","c":6,"n":75,"q":"Propellers exposed to salt spray should be flushed with.","o":["fresh water.","soapy water.","stoddard solvent."],"a":0,"e":""},{"id":"M17-E6-76","m":"M17","b":"E","c":6,"n":76,"q":"How can a steel propeller hub be tested for cracks?","o":["By magnetic particle inspection.","By anodizing.","By etching."],"a":0,"e":""},{"id":"M17-E6-77","m":"M17","b":"E","c":6,"n":77,"q":"Which of the following defects is cause of rejection of a wood propeller?","o":["An oversize hub or bolt hole, or elongated bolt holes.","Solder missing from screw heads securing metal tipping.","No protective coating on propeller."],"a":0,"e":""},{"id":"M17-E6-78","m":"M17","b":"E","c":6,"n":78,"q":"Longitudinal (fore and aft) clearance of constant speed propeller blades or cuffs must be at least 1/2 inch (12.7 mm) between propeller parts and stationary parts of the aircraft. This clearance is with the propeller blades.","o":["at the lowest pitch angle.","at take-off pitch (maximum thrust) angle.","feathered or in the most critical pitch configuration."],"a":2,"e":""},{"id":"M17-E6-79","m":"M17","b":"E","c":6,"n":79,"q":"When lubricating a Hartzell propeller blade with grease, to prevent damage to the blade seals, the service manual may recommend on some models to.","o":["remove the seals prior to greasing and reinstall them afterwards.","remove one of the two grease nipples for the blade, and grease the blade through the remaining nipple.","pump grea  the rear cone of a hydromatic propeller usually indicates a defective.","o":["spider-shaft oil seal.","piston gasket.","dome-barrel oil seal."],"a":0,"e":""},{"id":"M17-E6-86","m":"M17","b":"E","c":6,"n":86,"q":"Maximum taper contact between crankshaft and propeller hub is determined by using.","o":["a micrometer.","a surface gauge.","bearing blue colour transfer."],"a":2,"e":""},{"id":"M17-E6-87","m":"M17","b":"E","c":6,"n":87,"q":"Propeller blade tracking is the process of determining.","o":["the plane of rotation of the propeller with respect to the aircraft longitudinal axis.","that the blade angles are within specified tolerance of each other.","the positions of the tips of the propeller blades relative to each other."],"a":2,"e":""},{"id":"M17-E6-88","m":"M17","b":"E","c":6,"n":88,"q":"In what position is the constant-speed propeller control placed to check the magnetos?","o":["Full decrease, low propeller blade pitch angle.","Full increase, low propeller blade pitch angle.","Full increase, high propeller blade pitch angle."],"a":1,"e":""},{"id":"M17-E6-89","m":"M17","b":"E","c":6,"n":89,"q":"If a flanged propeller shaft has dowel pins.","o":["the propeller can be installed in only one position.","check carefully for front cone bottoming against the pins.","install the propeller so that the blades are positioned for hand propping."],"a":0,"e":""},{"id":"M17-E6-90","m":"M17","b":"E","c":6,"n":90,"q":"Repairs of aluminium alloy adjustable pitch propellers are not permitted to be made on the.","o":["face.","shank.","back."],"a":1,"e":""},{"id":"M17-E6-91","m":"M17","b":"E","c":6,"n":91,"q":"Which of the following methods is used to straighten a bent aluminium propeller blade that is within repairable limits?","o":["Either hot or cold straightening, depending on the location and severity of damage.","Cold straightening only.","Careful heating to accomplish straightening, followed by heat treatment to store original strength."],"a":1,"e":""},{"id":"M17-E6-92","m": ":""},{"id":"M17-I6-17","m":"M17","b":"I","c":6,"n":17,"q":"The static balance of a propeller may be adjusted by:","o":["adding or removing lead wool from counter-bores in the blade roots","indexing the propeller blades","adding or removing shims at the flange to hub interface"],"a":0,"e":""},{"id":"M17-I6-18","m":"M17","b":"I","c":6,"n":18,"q":"The normal vibration experienced by reciprocating engines is largely due to the:","o":["reciprocating motion of the crank-shaft","power strokes","asymmetric blade effect"],"a":1,"e":""},{"id":"M17-I6-19","m":"M17","b":"I","c":6,"n":19,"q":"A tracking check on a four bladed propeller compares the difference in track between:","o":["opposite blades","adjacent blades","all the blades"],"a":2,"e":""},{"id":"M17-I6-20","m":"M17","b":"I","c":6,"n":20,"q":"Dynamic balance may be confirmed by:","o":["a tracking check","placing the propeller on a mandrel supported by knife edges","blade indexing"],"a":0,"e":""},{"id":"M17-I6-21","m":"M17","b":"I","c":6,"n":21,"q":"The power output of a turbo-propeller engine is checked using:","o":["reference RPM","reference torque","reference thrust"],"a":1,"e":""},{"id":"M17-I6-22","m":"M17","b":"I","c":6,"n":22,"q":"The most likely cause of vibration experienced by a wooden propeller that has been in storage for a long period of time is:","o":["woodworm","warping","uneven moisture distribution"],"a":2,"e":""},{"id":"M17-I6-23","m":"M17","b":"I","c":6,"n":23,"q":"What solution is used to clean a metal propeller?","o":["soap and water","methylated spirit","acetone"],"a":0,"e":""},{"id":"M17-I6-24","m":"M17","b":"I","c":6,"n":24,"q":"The Aerodynamic Correction Factor is the:","o":["weight of lead wool to be inserted in a blade root","thrust of a blade corrected to ISA sea level conditions","coarse or fine angular displacement of a blade from a datum"],"a":2,"e":""},{"id":"M17-I6-25","m":"M17","b":"I","c":6,"n":25,"q":"A scratch on a steel blade is classified as a:","o":["minor repair","major repair","airworthy damage"],"a":0,"e":""},{"id":"M17-I6-26","m":"M17","b":"I","c":6,"n":26,"q":"What sequence is used to increase the power on a reciprocating engine?","o":["increase the RPM first, then increase the MAP","increase the MAP first, then increase the RPM","increase MAP and RPM simultaneously"],"a":0,"e":""},{"id":"M17-I6-27","m":"M17","b":"I","c":6,"n":27,"q":"Blending out damage on a propeller blade:","o":["restores aerodynamic efficiency","resists corrosion","prevents stress concentrations"],"a":2,"e":""},{"id":"M17-I6-28","m":"M17","b":"I","c":6,"n":28,"q":"When carrying out a shock load check on a propeller shaft, the eccentricity is:","o":["the total of the DTI variation","half the total of the DTI variation","twice the total of the DTI variation"],"a":1,"e":""},{"id":"M17-I6-29","m":"M17","b":"I","c":6,"n":29,"q":"When blending out a gouge on the face or camber side of a blade, the additional metal to be removed for stress relief is:","o":["0.02”","0.002”","0.2”"],"a":1,"e":""},{"id":"M17-I6-30","m":"M17","b":"I","c":6,"n":30,"q":"When a blend repair has been completed, the next action is to:","o":["check the balance of the propeller","carry out a crack detection check","protect the area from corrosion"],"a":1,"e":""},{"id":"M17-I6-31","m":"M17","b":"I","c":6,"n":31,"q":"An Aerodynamic Correction Factor that is preceded by the letter Q indicates:","o":["torque balance","thrust balance","dynamic balance"],"a":0,"e":""},{"id":"M17-I6-32","m":"M17","b":"I","c":6,"n":32,"q":"The Airworthiness Notice that refers to the overhaul and inspection requirements for variable pitch propellers is:","o":["AWN 55","AWN 4","AWN 75"],"a":0,"e":""},{"id":"M17-I6-33","m":"M17","b":"I","c":6,"n":33,"q":"If the tip of an electrical overshoe is torn:","o":["it may be cut back","it must not be cut back","it may be classified as acceptable damage"],"a":1,"e":""},{"id":"M17-I6-34","m":"M17","b":"I","c":6,"n":34,"q":"Small portions of rubber missing from an overshoe may be repaired by:","o":["filling with rubber dust and epoxy resin","by applying a repair patch","blending the area into a smooth depression"],"a":0,"e":""},{"id":"M17-I6-35","m":"M17","b":"I","c":6,"n":35,"q":"When fitting a new electrical overshoe to a blade you would use a:","o":["wooden roller","hot iron","rubber roller"],"a":2,"e":""},{"id":"M17-I6-36","m":"M17","b":"I","c":6,"n":36,"q":"When a propeller blade tip is cropped:","o":["the propeller must be re-balanced to compensate.","all the remaining blades must be cropped by the same amount","the Aerodynamic Correction factor is increased to compensate"],"a":1,"e":""},{"id":"M17-I6-37","m":"M17","b":"I","c":6,"n":37,"q":"The maximum RPM of a propeller may be altered by adjusting the:","o":["maximum RPM stop on the fuel control unit","maximum RPM stop on the propeller governor","the over-speed governor"],"a":1,"e":""},{"id":"M17-I6-38","m":"M17","b":"I","c":6,"n":38,"q":"When conducting a performance check on a turbo-propeller engine the condition lever should be set to:","o":["high RPM","low RPM","constant speed"],"a":0,"e":""},{"id":"M17-I6-39","m":"M17","b":"I","c":6,"n":39,"q":"An aircraft with a single left hand tractor propeller will tend to:","o":["roll to the left as power is increased","yaw to the left during the take-off run","roll to the right as power is increased"],"a":2,"e":""},{"id":"M17-I6-40","m":"M17","b":"I","c":6,"n":40,"q":"A tail-wheeled aircraft with a single right hand tractor propeller will:","o":["yaw to the right during take-off","yaw to the left during take-off","roll to the right after take-off"],"a":1,"e":""},{"id":"M17-I7-1","m":"M17","b":"I","c":7,"n":1,"q":"A wooden propeller should be stored:","o":["upright in a well lit storeroom","horizontal in a sealed crate","horizontal in a dark storeroom"],"a":2,"e":""},{"id":"M17-I7-2","m":"M17","b":"I","c":7,"n":2,"q":"When in short term storage, the pitch change mechanism on an installed variable pitch propeller should be exercised:","o":["weekly","fortnightly","monthly"],"a":1,"e":""},{"id":"M17-I7-3","m":"M17","b":"I","c":7,"n":3,"q":"While in long-term storage, the pre-loaded blade bearings on an uninstalled, variable pitch propeller should be exercised:","o":["annually","at six and nine months","weekly"],"a":0,"e":""},{"id":"M17-I7-4","m":"M17","b":"I","c":7,"n":4,"q":"An uninstalled variable pitch propeller that is in long-term storage and is not in its original manufacturer’s packing should be reinhibited:","o":["every three months","annually","every three years"],"a":1,"e":""},{"id":"M17-I7-5","m":"M17","b":"I","c":7,"n":5,"q":"Rubber components should be stored in:","o":["the dark","natural light","fluorescent light"],"a":0,"e":""},{"id":"M17-I7-6","m":"M17","b":"I","c":7,"n":6,"q":"Whilst in long term storage, pre-loaded blade bearings should be dismantled and inspected:","o":["after six and nine months","after three years","annually"],"a":1,"e":""},{"id":"M17-I7-7","m":"M17","b":"I","c":7,"n":7,"q":"The preservative used to protect metal blades is:","o":["brown storage wax","petroleum jelly","lanolin"],"a":2,"e":""},{"id":"M17-I7-8","m":"M17","b":"I","c":7,"n":8,"q":"Short term propeller storage is a period not exceeding:","o":["six months","three months","one week"],"a":1,"e":""},{"id":"M17-I7-9","m":"M17","b":"I","c":7,"n":9,"q":"The components that are used to secure a propeller to its shaft are:","o":["propeller parts","engine parts","neither engine or propeller parts"],"a":1,"e":""},{"id":"M17-I7-10","m":"M17","b":"I","c":7,"n":10,"q":"When preparing a variable pitch propeller for installation, the inhibiting oil in the pitch change mechanism is:","o":["left in the mechanism","flushed out with the feathering pump","drained before installation"],"a":2,"e":""},{"id":"M17-I7-11","m":"M17","b":"I","c":7,"n":11,"q":"The maximum storage periods for installed propellers are detailed in the:","o":["Propeller Overhaul and Repair Manual","Aircraft Maintenance Manual","Airworthiness Notices"],"a":1,"e":""},{"id":"M17-I7-12","m":"M17","b":"I","c":7,"n":12,"q":"If the engine carrying an installed variable pitch propeller in short term storage cannot be ground run, the pitch change mechanism must be:","o":["feathered and un-feathered weekly","exercised by hand fortnightly","left static for up to three months"],"a":1,"e":""}];
const C17={1:"17.1 Fundamentals",2:"17.2 Propeller Construction",3:"17.3 Propeller Pitch Control",4:"17.4 Propeller Synchronising",5:"17.5 Propeller Ice Protection",6:"17.6 Propeller Maintenance",7:"17.7 Propeller Storage and Preservation"};
const MODS={M17:{name:"Module 17 Propellers 螺旋槳",banks:{E:"EASA 題庫",I:"ICAT 題庫"},ch:{E:C17,I:C17},note:{I:"ICAT 原始檔沒有附答案，本站答案由 AI 依 EASA 題庫與教材推定，部分題目可能有誤，請以教材與手冊為準。"}}};
const chn=q=>MODS[q.m].ch[q.b][q.c];
let st={w:{},n:{}};try{st=Object.assign(st,JSON.parse(localStorage.getItem("m17")||"{}"))}catch(e){}
for(const t of["w","n"])for(const k of Object.keys(st[t]))if(!k.startsWith("M")){st[t]["M17-"+k]=st[t][k];delete st[t][k]}
const save=()=>{try{localStorage.setItem("m17",JSON.stringify(st))}catch(e){}};
let S={m:"M17",b:"E",chs:{},mode:"rand",lim:0};
const cs=()=>S.chs[S.m+S.b]||(S.chs[S.m+S.b]=new Set(Object.keys(MODS[S.m].ch[S.b]).map(Number)));
let Q=[],i=0,right=0,miss=[],done=false;
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pool=()=>D.filter(q=>q.m===S.m&&q.b===S.b&&cs().has(q.c));
function home(){
 const M=MODS[S.m],inB=D.filter(q=>q.m===S.m&&q.b===S.b),wn=inB.filter(q=>st.w[q.id]).length;
 let h=`<h1>EASA Part-66 刷題</h1><p class="s">隨機、順序、錯題三種練習，章節可自由勾選。</p>
 <h2 style="margin-top:.6em">選擇模組</h2><div class="row">${Object.keys(MODS).map(k=>`<button class="${S.m===k?"on":""}" data-mod="${k}">${MODS[k].name}</button>`).join("")}</div>
 <div class="tabs" style="margin-top:12px">${Object.keys(M.banks).map(b=>`<button class="${S.b===b?"on":""}" data-b="${b}">${M.banks[b]}（${D.filter(q=>q.m===S.m&&q.b===b).length} 題）</button>`).join("")}</div>`;
 if(M.note&&M.note[S.b])h+=`<p class="warn">${M.note[S.b]}</p>`;
 h+=`<h2>選擇章節</h2><div class="row" style="margin-bottom:8px"><button data-all="1">全選</button><button data-all="0">全不選</button></div>`;
 const CH=M.ch[S.b];for(const c of Object.keys(CH)){const n=inB.filter(q=>q.c==c).length,w=inB.filter(q=>q.c==c&&st.w[q.id]).length;
  if(!n)continue;h+=`<label class="ch"><input type="checkbox" data-c="${c}" ${cs().has(+c)?"checked":""}><span class="t">${CH[c]}</span><small>${n} 題${w?`・錯題 ${w}`:""}</small></label>`}
 h+=`<h2>練習模式</h2><div class="row">${[["rand","隨機出題"],["seq","順序出題"],["wrong",`錯題練習（${wn}）`]].map(([k,v])=>`<button class="${S.mode===k?"on":""}" data-m="${k}">${v}</button>`).join("")}</div>
 <h2>題數</h2><div class="row">${[[0,"全部"],[20,"20 題"],[50,"50 題"]].map(([k,v])=>`<button class="${S.lim===k?"on":""}" data-l="${k}">${v}</button>`).join("")}</div>
 <button class="go" id="go">開始練習</button><p class="ref">紀錄與錯題本只存在這台裝置的瀏覽器中。<button id="clr" style="padding:2px 8px;font-size:.8rem;margin-left:6px">清除紀錄</button></p>`;
 app.innerHTML=h;
 app.querySelectorAll("[data-mod]").forEach(e=>e.onclick=()=>{S.m=e.dataset.mod;S.b=Object.keys(MODS[S.m].banks)[0];home()});
 app.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>{S.b=e.dataset.b;home()});
 app.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>{S.mode=e.dataset.m;home()});
 app.querySelectorAll("[data-l]").forEach(e=>e.onclick=()=>{S.lim=+e.dataset.l;home()});
 app.querySelectorAll("[data-c]").forEach(e=>e.onchange=()=>{e.checked?cs().add(+e.dataset.c):cs().delete(+e.dataset.c)});
 app.querySelectorAll("[data-all]").forEach(e=>e.onclick=()=>{S.chs[S.m+S.b]=new Set(e.dataset.all==="1"?Object.keys(CH).map(Number):[]);home()});
 $("#go").onclick=()=>start();
 $("#clr").onclick=()=>{if(confirm("要清除所有作答紀錄和錯題本嗎？")){st={w:{},n:{}};save();home()}};
}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(list){
 let p=list||pool();
 if(!list&&S.mode==="wrong")p=p.filter(q=>st.w[q.id]);
 if(!p.length){alert(S.mode==="wrong"&&!list?"目前這些章節沒有錯題。":"請至少勾選一個章節。");return}
 if(!list&&S.mode==="rand")p=shuffle(p);
 if(list)p=shuffle(p);
 if(!list&&S.lim)p=p.slice(0,S.lim);
 Q=p;i=0;right=0;miss=[];quiz();
}
function quiz(){
 const q=Q[i];
 let h=`<div class="top"><span>${MODS[q.m].banks[q.b]}・${chn(q)}</span><button id="quit">結束</button></div>
 <div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="top"><span>第 ${i+1} / ${Q.length} 題</span><span>答對 ${right}</span></div>
 <p class="q">${esc(q.q)}</p>`;
 q.o.forEach((t,k)=>h+=`<button class="o" data-k="${k}"><b>${"abc"[k]})</b><span>${esc(t)}</span></button>`);
 h+=`<div id="fb"></div>`;app.innerHTML=h;scrollTo(0,0);
 $("#quit").onclick=()=>{if(confirm("要結束這次練習嗎？"))result()};
 app.querySelectorAll(".o").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
 const q=Q[i],bs=app.querySelectorAll(".o");if(bs[0].disabled)return;
 bs.forEach(b=>b.disabled=true);bs[q.a].classList.add("ok");
 st.n[q.id]=(st.n[q.id]||0)+1;
 if(k===q.a){right++;if(st.w[q.id])delete st.w[q.id]}else{bs[k].classList.add("no");st.w[q.id]=1;miss.push(q)}
 save();
 let f=`<div class="ex"><b>${k===q.a?"答對了":"答錯了"}，正確答案是 ${"abc"[q.a]})</b>${q.e?`<div>${esc(q.e)}</div>`:""}${MODS[q.m].note&&MODS[q.m].note[q.b]?`<div class="ref">此題答案為 AI 推定</div>`:""}</div>`;
 f+=`<button class="go" id="nx">${i+1<Q.length?"下一題":"看結果"}</button>`;
 $("#fb").innerHTML=f;$("#nx").onclick=()=>{i++;i<Q.length?quiz():result()};$("#nx").focus();
}
function result(){
 const n=i+(app.querySelector(".o")&&app.querySelector(".o").disabled?1:0),t=Math.min(n,Q.length);
 let h=`<h1>練習結果</h1><div class="big">${t?Math.round(right/t*100):0}%</div><p class="s">作答 ${t} 題，答對 ${right} 題，答錯 ${miss.length} 題。</p>`;
 if(miss.length){h+=`<h2>這次答錯的題目</h2>`+miss.map(q=>`<div class="wl"><div>${esc(q.q)}</div><div class="ref">正確：${"abc"[q.a]}) ${esc(q.o[q.a])}</div></div>`).join("")+`<button class="go" id="rw" style="margin-top:8px">重做這次錯題</button>`}
 h+=`<button class="go" id="hm" style="background:var(--sf);color:var(--ink);border-color:var(--ln);margin-top:10px">回首頁</button>`;
 app.innerHTML=h;scrollTo(0,0);
 if($("#rw"))$("#rw").onclick=()=>start(miss.slice());
 $("#hm").onclick=home;
}
home();
</script></body></html>
